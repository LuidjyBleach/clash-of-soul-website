name: Website checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:security
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          npm run preview -- --port 4173 &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4173/clash-of-soul-website/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-preview-and-checks
          path: test-results/
